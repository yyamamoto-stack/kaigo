<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- ポップアップUI。JSONを貼り付けて実行するだけのシンプルな画面 -->
  <title>カイポケ自動入力</title>
  <style>
    /* 拡張機能ポップアップの最小限のスタイル（外部CSSは読み込まない） */
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      width: 380px;
      margin: 0;
      padding: 12px;
      font-size: 13px;
      color: #222;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    .note {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 10px;
      line-height: 1.5;
      font-size: 12px;
    }
    textarea {
      width: 100%;
      height: 220px;
      box-sizing: border-box;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f5f5f5;
    }
    button.primary {
      background: #1976d2;
      color: #fff;
      border-color: #1565c0;
      font-weight: bold;
    }
    #status {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .status-error { color: #c62828; }
    .status-ok { color: #2e7d32; }
    .status-info { color: #555; }
  </style>
</head>
<body>
  <h1>カイポケ 訪問介護計画書 自動入力</h1>

  <!-- 免責・注意事項。最終登録は必ず人間が行うことを明記 -->
  <div class="note">
    ⚠️ 自動入力は「下書き」までを行います。<br>
    入力後は<strong>必ず目視で内容を確認</strong>し、<strong>作成状態を「作成済」にしてから
    ご自身で「登録する」を押してください</strong>。<br>
    ⚠️ サービス設定は<strong>別ウィンドウ（ポップアップ）</strong>で開きます。
    ブロックされないよう許可してください。<br>
    自動化による誤登録は免責事項です。
  </div>

  <!-- JSONデータの貼り付け欄。basicInfo と services を持つ階層構造 -->
  <label for="jsonInput">JSONデータ（basicInfo / services）</label>
  <textarea id="jsonInput" placeholder='{&#10;  "basicInfo": { ... },&#10;  "services": [ ... ]&#10;}'></textarea>

  <div class="row">
    <button id="clearBtn" type="button">JSONをクリア</button>
    <button id="runBtn" class="primary" type="button">自動入力を実行</button>
  </div>

  <!-- 進捗表示（background からの PROGRESS 通知で更新。アイコンバッジにも同じ％が出る） -->
  <div id="progressWrap" style="display:none; margin-top:10px;">
    <div id="progressLabel" style="font-size:12px; color:#555; margin-bottom:4px;"></div>
    <div style="background:#eee; border-radius:6px; height:10px; overflow:hidden;">
      <div id="progressBar" style="background:#1976d2; height:100%; width:0%; transition:width .3s;"></div>
    </div>
  </div>

  <div id="status" class="status-info"></div>

  <!-- 診断用：カイポケ計画書画面へ実際に送信されたPOST内容（直近10件・ローカル記録のみ）をコピーする。
       移動支援（保険外）の保存不具合の調査で、手動登録と自動入力のPOSTを比較するために使う。 -->
  <div class="row">
    <button id="diagBtn" type="button" style="flex:none; width:100%; font-size:12px; color:#555;">🔧 診断ログをコピー（システム部の調査用）</button>
  </div>

  <!-- 外部スクリプトは読み込まず、popup.js のみ（CSP準拠） -->
  <script src="popup.js"></script>
</body>
</html>
